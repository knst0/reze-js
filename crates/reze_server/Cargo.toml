[package]
name = "reze_server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
actix = ["dep:actix-web"]
tower = ["dep:tower-service", "dep:http-body-util"]
dev = []

[dependencies]
actix-web = { version = "4.18.1", default-features = false, optional = true }
bytes = "1.12.1"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http = "1.5.0"
http-body-util = { version = "0.1.5", optional = true }
percent-encoding = "2.3.2"
reze = { path = "../reze" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.7"
tower-service = { version = "0.3.3", optional = true }
tracing = "0.1.44"
