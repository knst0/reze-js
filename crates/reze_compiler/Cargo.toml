[package]
name = "reze_compiler"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
oxc_allocator = "0.151.0"
oxc_ast = "0.151.0"
oxc_ast_visit = "0.151.0"
oxc_parser = "0.151.0"
oxc_semantic = "0.151.0"
oxc_span = "0.151.0"
oxc_syntax = "0.151.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }

[build-dependencies]
serde_json = "1.0.151"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
codspeed-divan-compat = "5.0.2"

[[bench]]
name = "compile"
harness = false
