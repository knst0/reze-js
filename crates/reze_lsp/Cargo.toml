[package]
name = "reze-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "reze-lsp"
path = "src/main.rs"

[lib]
name = "reze_lsp"
path = "src/lib.rs"

[dependencies]
reze-compiler = { path = "../reze_compiler" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
lsp-server = "0.10"
lsp-types = "0.97"
