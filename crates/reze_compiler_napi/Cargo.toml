[package]
name = "reze_compiler_napi"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_json = "1.0.151"
reze_compiler = { path = "../reze_compiler" }

[build-dependencies]
napi-build = "2"
