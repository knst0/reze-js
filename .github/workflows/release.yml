name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compiler: ${{ steps.plan.outputs.compiler }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main only"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Version packages
        id: plan
        run: |
          pnpm changeset version
          old=$(git show HEAD:packages/compiler/package.json | jq -r .version)
          new=$(jq -r .version packages/compiler/package.json)
          if [ "$old" != "$new" ]; then
            sed -i "s/'${old//./\\.}'/'$new'/g; s/expected ${old//./\\.} but/expected $new but/g" packages/compiler/index.js
            echo "compiler=true" >> "$GITHUB_OUTPUT"
          else
            echo "compiler=false" >> "$GITHUB_OUTPUT"
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No pending changesets. Run 'pnpm changeset' and merge it into main first"
            exit 1
          fi
          git diff --cached --binary > release.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-patch
          path: release.patch
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Verify
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Format
        run: pnpm exec oxfmt --check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test:fast
      - name: Test Rust
        run: pnpm test:rust

  build-native:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.compiler == 'true'
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            napi_args: --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            napi_args: --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            napi_args: -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            napi_args: -x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: endsWith(matrix.target, '-musl')
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: endsWith(matrix.target, '-musl')
        with:
          tool: cargo-zigbuild
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @rezejs/compiler
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
        shell: bash
      - name: Build
        run: pnpm --filter @rezejs/compiler build --target ${{ matrix.target }} ${{ matrix.napi_args }}
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: packages/compiler/reze-compiler.*.node
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [plan, verify, build-native]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-patch
      - name: Apply release patch
        run: git apply --index release.patch
      - name: Build
        run: pnpm --filter "./packages/*" --filter "!@rezejs/compiler" build
      - name: Create native packages
        if: needs.plan.outputs.compiler == 'true'
        working-directory: packages/compiler
        run: ./node_modules/.bin/napi create-npm-dirs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.compiler == 'true'
        with:
          pattern: bindings-*
          path: packages/compiler/artifacts
      - name: Stage native packages
        if: needs.plan.outputs.compiler == 'true'
        working-directory: packages/compiler
        run: |
          ./node_modules/.bin/napi artifacts --output-dir artifacts
          ./node_modules/.bin/napi pre-publish --skip-optional-publish
      - name: Publish native packages
        if: needs.plan.outputs.compiler == 'true'
        run: pnpm publish -r --filter "./packages/compiler/npm/*" --access public --provenance --no-git-checks
      - name: Publish
        run: pnpm publish -r --access public --provenance --no-git-checks

  release:
    name: Commit and tag
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-patch
      - name: Apply release patch
        run: git apply --index release.patch
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: version packages"
          git diff-tree --no-commit-id --name-only -r HEAD -- 'packages/*/package.json' | while read -r manifest; do
            git tag "$(jq -r '"\(.name)@\(.version)"' "$manifest")"
          done
      - name: Push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --atomic origin HEAD:main --tags
