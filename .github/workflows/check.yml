name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-ssg:
    name: Packaged SSG (vite ${{ matrix.vite }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        vite: ["6.4.0", "7.0.0", "8.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Packaged SSG smoke
        run: node packages/vite-plugin/scripts/packaged-ssg-smoke.mjs --vite ${{ matrix.vite }} --browsers chromium,firefox,webkit
      - name: Full SSG browser acceptance
        if: matrix.vite == '8.0.0'
        env:
          REZE_SSG_BROWSERS: chromium,firefox,webkit
        run: pnpm exec vp test run --project @rezejs/vite-plugin
