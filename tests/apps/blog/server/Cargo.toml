[package]
name = "blog_server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
actix-web = { version = "4.18.1", default-features = false }
axum = "0.8.9"
blog_types = { path = "../types" }
reze_server = { path = "../../../../crates/reze_server", features = ["actix", "tower", "dev"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
reze_build = { path = "../../../../crates/reze_build" }
